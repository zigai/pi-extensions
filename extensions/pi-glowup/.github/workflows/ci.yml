name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check
        run: npm run check

      - name: Informational TUI benchmark smoke
        run: npm run benchmark:tui -- --quick

      - name: Upload PTY failure frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pi-glowup-pty-failure
          path: artifacts/pty/
          if-no-files-found: ignore
          retention-days: 7
