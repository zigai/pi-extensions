name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run format:check && npm run architecture:check && npm run collection:check && npm run config:check && npm run language-catalog:check --workspaces --if-present && npm run lint && npm run typecheck && npm run build && npm run test:package && npm run test:package --workspaces --if-present && npm run check:package --workspaces --if-present && npm test

  goal-platform:
    name: pi-goal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and install packed pi-goal
        run: node extensions/pi-goal/scripts/platform-verification/platform-build.mjs
