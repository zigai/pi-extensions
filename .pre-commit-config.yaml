repos:
  - repo: local
    hooks:
      - id: config-check
        name: generated config artifacts
        entry: npm run config:check
        language: system
        pass_filenames: false
      - id: format-check
        name: format check (shared and isolated workspace contracts)
        entry: node scripts/tracked-check.ts format
        language: system
        pass_filenames: false
      - id: lint
        name: lint (shared and isolated workspace contracts)
        entry: node scripts/tracked-check.ts lint
        language: system
        pass_filenames: false
